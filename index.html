<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Project</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 2.5rem; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; max-width: 450px; border: 1px solid #334155; }
        h1 { color: var(--accent); margin-top: 0; font-size: 1.8rem; }
        .ip-box { background: #0ea5e920; padding: 10px; border-radius: 8px; color: #fbbf24; font-family: monospace; font-size: 1.2rem; margin: 15px 0; border: 1px dashed #fbbf24; }
        p { color: #94a3b8; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nginx Load Balancer</h1>
        <p>Permintaan Anda dilayani oleh Backend IP:</p>
        
        <div id="backend-ip" class="ip-box">Loading...</div>

        <p style="font-size: 0.8rem;">(Refresh halaman untuk melihat perubahan IP)</p>
    </div>

    <script>
        // Mengambil header dari response halaman ini sendiri
        fetch(window.location.href)
            .then(response => {
                const backendIp = response.headers.get('X-Backend-Server');
                document.getElementById('backend-ip').innerText = backendIp || "IP Tidak Terdeteksi";
            })
            .catch(err => {
                document.getElementById('backend-ip').innerText = "Error fetching header";
            });
    </script>
</body>
</html>
