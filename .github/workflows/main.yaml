name: CI to Docker Hub
on:
  push:
    branches: ["main"] #pipelines akan jalan ketika ada push ke branch main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Image Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/nginx-loadbalancer:latest'
        format: 'table'
        exit-code: '0' #jika ada kerentanan, trivy akan tetap exit dengan kode 0 sehingga pipeline tidak gagal
