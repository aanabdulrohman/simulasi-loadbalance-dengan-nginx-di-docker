<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Project | Nginx Load Balancer</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 2.5rem; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; max-width: 450px; border: 1px solid #334155; }
        h1 { color: var(--accent); margin-top: 0; font-size: 1.8rem; }
        p { color: #94a3b8; line-height: 1.6; }
        .instruction { background: #0ea5e920; padding: 1rem; border-radius: 8px; border-left: 4px solid var(--accent); text-align: left; margin-top: 1.5rem; }
        code { color: var(--accent); font-family: monospace; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nginx Load Balancer</h1>
        <p>Proyek ini mensimulasikan pendistribusian trafik ke beberapa kontainer backend secara <b>Round Robin</b>.</p>
        
        <div class="instruction">
            <strong>Cara Verifikasi:</strong>
            <ol style="font-size: 0.9rem; padding-left: 20px;">
                <li>Buka Inspect Element (F12)</li>
                <li>Pilih tab <b>Network</b></li>
                <li>Refresh halaman</li>
                <li>Klik nama file (localhost) dan cek <b>Response Headers</b></li>
                <li>Cari <code>X-Backend-Server</code></li>
            </ol>
        </div>
    </div>
</body>
</html>
